<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Celicatesen</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecera">
        <nav class="contenedor menu">
            <a href="/"><img class="menu-logo" src="imagenes/Logo.png" alt="Celicatesen"></a>
            <span class="menu-titulo">Panel de administración</span>
            <a class="btn btn-claro" href="/">Ver tienda →</a>
        </nav>
    </header>

    <main class="contenedor">
        <!-- Sin sesión: lo único visible es el login. -->
        <section class="login" id="loginSection" hidden>
            <div class="tarjeta">
                <img class="login-logo" src="imagenes/Logo.png" alt="">
                <h1>Administración</h1>
                <p class="bajada">Entrá con tu cuenta para gestionar el catálogo.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-ancho">Entrar</button>
                </form>
                <div id="loginMessage"></div>
            </div>
        </section>

        <!-- Con sesión: el panel. -->
        <section class="panel" id="adminSection" hidden>
            <div class="panel-cabecera">
                <div>
                    <h1>Productos</h1>
                    <p class="bajada">Lo que cargues acá aparece en la tienda al instante.</p>
                </div>
                <button type="button" class="btn btn-claro" id="logoutButton">Cerrar sesión</button>
            </div>

            <div class="tarjeta">
                <h2>Lista de productos</h2>
                <div class="table-container">
                    <table class="products-table" id="productsTable">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Marca</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tarjeta">
                <h2 id="formTitle">Agregar Nuevo Producto</h2>
                <form id="productForm" class="form-grilla">
                    <div class="form-group">
                        <label for="sku">SKU *</label>
                        <input type="text" id="sku" name="sku" placeholder="CELI-004" required>
                        <div class="error" id="skuError"></div>
                    </div>

                    <div class="form-group">
                        <label for="name">Nombre del Producto *</label>
                        <input type="text" id="name" name="name" required>
                        <div class="error" id="nameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="brand">Marca *</label>
                        <input type="text" id="brand" name="brand" value="Celicatesen" required>
                        <div class="error" id="brandError"></div>
                    </div>

                    <div class="form-group">
                        <label for="category">Categoría *</label>
                        <input type="text" id="category" name="category" value="general" required>
                        <div class="error" id="categoryError"></div>
                    </div>

                    <div class="form-group">
                        <label for="price">Precio *</label>
                        <input type="number" id="price" name="price" step="0.01" min="0" value="0" required>
                        <div class="error" id="priceError"></div>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock *</label>
                        <input type="number" id="stock" name="stock" min="0" value="0" required>
                        <div class="error" id="stockError"></div>
                    </div>

                    <div class="form-group form-ancho">
                        <label for="description">Descripción *</label>
                        <textarea id="description" name="description" rows="3" required></textarea>
                        <div class="error" id="descriptionError"></div>
                    </div>

                    <div class="form-group form-ancho">
                        <label for="imageUrl">Imagen *</label>
                        <input type="text" id="imageUrl" name="imageUrl" placeholder="imagenes/Brownies.jpg o https://…" required>
                        <div class="error" id="imageUrlError"></div>
                    </div>

                    <div class="form-acciones form-ancho">
                        <button type="submit" class="btn" id="submitButton">Agregar Producto</button>
                        <button type="button" class="btn btn-claro" id="cancelEditButton" hidden>Cancelar edición</button>
                    </div>
                </form>
                <div id="formMessage"></div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
